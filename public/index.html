<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia Online</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        input { padding: 10px; border-radius: 5px; border: none; margin-bottom: 10px; width: 80%; }
        button { padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .player-card { background: #1e1e1e; padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #333; }
    </style>
</head>
<body>
    <h1>🕵️‍♂️ مافيا أونلاين</h1>
    <div id="login-section">
        <input type="text" id="username" placeholder="ادخل اسمك المستعار">
        <br>
        <button onclick="join()">دخول اللعبة</button>
    </div>
    <div id="game-section" style="display:none;">
        <h3>اللاعبون المتصلون:</h3>
        <div id="player-list"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function join() {
            const name = document.getElementById('username').value;
            if(name) {
                socket.emit('joinGame', name);
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('game-section').style.display = 'block';
            }
        }
        socket.on('updatePlayerList', (players) => {
            const list = document.getElementById('player-list');
            list.innerHTML = players.map(p => `<div class="player-card">${p.name}</div>`).join('');
        });
    </script>
</body>
</html>
